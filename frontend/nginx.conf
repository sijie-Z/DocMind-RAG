# DocMind Frontend — Production Nginx Configuration

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint (no redirect)
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Static assets (immutable, long cache)
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        # nginx 的 add_header 不跨层继承合并：本 location 一旦声明 add_header，
        # server 级安全头全部失效，必须在此重复（否则静态资源丢 nosniff 等）。
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # 批次十八：公开知识库页面允许被嵌入（iframe 小部件）。
    # 仅此前缀放开：去掉 X-Frame-Options，改用 CSP frame-ancestors 允许任意来源；
    # 其它路径（管理/登录等 SPA 路由）仍由下面的 location / 发送 SAMEORIGIN。
    # 注意 1：本 location 声明了自己的 add_header，server 级安全头不再继承，
    #         因此下面必须重复 nosniff/referrer 等全部头。
    # 注意 2：不能用 try_files 的最后一个参数回退到 /index.html——那会内部
    #         重定向到 location /，本 location 的 embed 头会全部丢失；用
    #         rewrite ... break 在当前 location 内完成 SPA 回退（nginx 1.25 实测）。
    location /public/kb/ {
        if (!-e $request_filename) {
            rewrite ^ /index.html break;
        }
        # 服务端入口标记：nginx 的 URI 规范化（解码/合并斜杠/点段）与浏览器
        # location.pathname 不完全一致；前端路由守卫据此识别可嵌入文档，
        # 防止 //public/kb/x、/%70ublic/kb/x 等写法绕过。
        sub_filter '<head>' '<head><meta name="docmind-public-kb-entry" content="1">';
        sub_filter_once on;
        sub_filter_types text/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        # 公开链接是能力 URL：禁止搜索引擎收录/跟随，降低 token 扩散面。
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # SPA: serve index.html for all non-asset, non-API routes
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        # 同上：本 location 的 add_header 会取消 server 级继承；管理/登录/普通
        # 页面必须显式保持 SAMEORIGIN（批次十八的安全边界）。
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # WebSocket endpoints (issue #258): handshakes need a real protocol upgrade —
    # the generic /api/ proxy below does not forward Upgrade/Connection, so the
    # browser handshake would arrive as plain HTTP and never switch protocols.
    location = /api/v1/notifications/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location = /api/v1/chat/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # issue #477：持久终端 WS（路径带 terminal_id 后缀，必须用前缀匹配）。
    location /api/v1/terminal/ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
    }

    # 版本号动态读取（ISS-2 数字对账）：关于页/聊天侧栏经 GET /health 读
    # 后端 APP_VERSION。根级路由不走 /api/ 前缀；此前会落进 SPA 的 try_files
    # 回退返回 index.html。与 dev 的 vite proxy '/health' 同口径。
    location = /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
    }


    # WebSocket proxy (chat + notification streams)
    location /ws/ {
        proxy_pass http://backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # SSE proxy (agent streaming)
    location /api/v1/agent/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_http_version 1.1;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
