name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC，补 nightly 不覆盖的语义级漏洞
  workflow_dispatch:       # 允许手动触发：CodeQL 的 SARIF 上传偶发瞬时失败时，
                           # 可不必等下一次 push 或周一的 schedule 就重跑

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write   # 需要写入 SARIF 结果到 Security 面板
      actions: read            # 私有仓库需要，公开仓库无害

    strategy:
      fail-fast: false
      matrix:
        # Python 与 JavaScript/TypeScript 都是解释型语言，不需要构建。
        # build-mode 只在「每个 job 只分析一种语言」时可用，matrix 正好满足。
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended：只跑安全查询（比默认集更多），不含「代码质量」查询。
          # 原先用 security-and-quality，python 侧产生 135 条结果、其中 83 条是
          # note 级的质量提示（empty-except / unused-import / unused-variable）——
          # 这些与仓库已有的 ruff + eslint 重复，却把真正的安全发现淹没，
          # 并把 SARIF 撑大（python 上传约 20 秒后失败，js 仅 19 条结果则从不失败）。
          queries: security-extended

      # 解释型语言无需 autobuild：build-mode=none 由 CodeQL 直接抽取源码。

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
