name: Dependency Review

# 职责边界（与其它工具不重叠）：
#   Dependency Review = 这个 PR 有没有把新的危险依赖带进来（只审查**变化**）
#   Dependabot        = 当前依赖树里已有哪些已知漏洞（基线监控）
#   Bandit / CodeQL   = 代码层面的静态分析
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read        # 只读即可：不往 PR 写评论，结果由 job summary 表达

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          # 只阻断 high 及以上：单人项目不该因为一个 low 级 advisory 就卡住 PR。
          # 较低等级交由 Dependabot 持续跟踪。
          fail-on-severity: high
          # 默认只查 runtime scope，而本仓库 6 个 high 里 4 个源自 devDependency
          # （@vue/eslint-config-typescript 那条链）—— 开发依赖同样会在本地与 CI 里
          # 执行（postinstall / 构建工具），不属于"可以忽略"的类别。
          fail-on-scopes: runtime, development
          # 不启 license 检查：仓库目前没有明确的许可证策略，
          # 没有规则的门禁只是"看起来专业"的噪音。
          license-check: false
