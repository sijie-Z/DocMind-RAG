name: CI Hygiene

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 只校验本次 PR 新增的提交，不追溯历史提交（历史里本来就不全是
      # conventional commit，全量校验会立刻红且无法修复）。
      - name: Lint PR commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  pr-label:
    name: PR Labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  # 任务书原文在此处被截断（以 "..." 占位），第三个 job 由执行方按
  # "零配置、不依赖外部 action、只检查本 PR 新增行" 的原则补全：
  # 防止未解决的合并冲突标记被误提交。
  #
  # 实现说明（v1 有 fail-open 缺陷，经对抗评审修正）：
  # - PR checkout 默认浅克隆且签出的是 merge 提交（refs/pull/<n>/merge），
  #   三点 diff（A...B）在此条件下求不出 merge-base 会直接 fatal；
  # - 且绝不能写 `if git diff ... | grep`：git 失败会被 grep 的退出码
  #   掩盖成"绿"（假阴性）。因此 diff 单独成命令、重定向到文件
  #   （失败时 bash -e 立即让 step 红），再对落盘 diff 做 grep；
  # - 两点 diff（基线 tip → merge 提交）不需要 merge-base，浅克隆可用，
  #   且对 PR 场景即本 PR 的完整改动。
  conflict-markers:
    name: Conflict Markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Detect merge conflict markers in PR diff
        run: |
          BASE="refs/remotes/origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:$BASE"
          git diff "$BASE" HEAD --unified=0 > /tmp/pr.diff
          # 只匹配 <<<<<<< / >>>>>>>（======= 是合法的 Markdown setext 标题标记，
          # 不能匹配，否则文档改动会误报）。
          if grep -E '^\+(<<<<<<<|>>>>>>>)' /tmp/pr.diff; then
            echo "::error::发现未解决的合并冲突标记"
            exit 1
          fi
          echo "未发现冲突标记"

  # 根目录内部工作报告（.ci-*.md / .e2e-*.md，如第一轮问题清单的排查产物）
  # 不得再提交：它们是会话过程的个人备忘与临时结论，不属于产品文档。
  # 六个文件已随 chore/repo-hygiene 从历史中 git rm 并加入 .gitignore；本 job
  # 是防再提交的兜底——.gitignore 只挡 `git add`，挡不住 `git add -f` 与回填。
  internal-reports:
    name: Internal Reports Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail if internal work reports exist at repo root
        run: |
          matches=$(find . -maxdepth 1 -type f \( -name '.ci-*.md' -o -name '.e2e-*.md' \) -print)
          if [ -n "$matches" ]; then
            echo "::error::内部工作报告不得提交到仓库根目录:"
            echo "$matches"
            exit 1
          fi
          echo "OK: 根目录无内部工作报告"

  # 发布纪律：CHANGELOG 顶部版本标题与 APP_VERSION 必须同 PR bump（第二轮
  # §7.2⑦ / §三.15——1.22.0 与 1.22.1-rc.1 两次发布只改了 CHANGELOG，线上
  # /health 仍报 1.21.0）。diff 驱动：仅当本 PR 动了发布版本才比对，普通
  # PR 在 [Unreleased] 加条目不误红；rc 写法归一与日期无关等规则见脚本
  # docstring（R1~R4，逐条有鉴别力测试）。
  release-sync:
    name: Release Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 与 conflict-markers 同款两点 diff 口径：base tip ↔ PR merge 提交。
      - name: Fetch base branch
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Check CHANGELOG / APP_VERSION same-PR bump
        working-directory: backend
        run: python scripts/check_release_sync.py --base "origin/${{ github.base_ref }}"

      - name: Checker discriminating-power tests
        working-directory: backend
        run: |
          python -m pip install -q pytest
          python -m pytest tests/unit/test_check_release_sync.py -q --noconftest

  # issue #98：`try` 体内**直接** raise 的控制流异常（AppError 及其子类、
  # fastapi.HTTPException）不得被同层 `except Exception` 降级成 500 / 200 错误
  # 字典。这一缺陷模式已复发多次（issue #82 / #90 / #98），加静态门禁防止第 8 次。
  # 脚本零依赖（仅标准库 ast），不安装后端依赖栈。
  except-control-flow:
    name: Except Control Flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # PR 门禁本体：扫 app/api/v1/endpoints + app/services，违规 → exit 1。
      - name: Scan for control-flow exceptions swallowed by except Exception
        working-directory: backend
        run: python scripts/check_except_control_flow.py

      # 同时跑检查器的鉴别力测试（违规样例必红、放行样例不误报、空树 exit 2）。
      # tests/conftest.py 会 import fastapi 等全量后端依赖，本 job 不装这些；
      # 该测试文件只用合成源码 + 标准库，因此用 --noconftest 跳过 conftest
      # （全量单测仍由 ci-fast 的 backend-tests 覆盖，不在此处重复）。
      - name: Checker discriminating-power tests
        working-directory: backend
        run: |
          python -m pip install -q pytest
          python -m pytest tests/unit/test_check_except_control_flow.py -q --noconftest

  # A2 P0 租户边界：禁止生产代码把组织上下文硬编码默认到 1 号组织。
  # `organization_id: int = 1` 会让漏传组织的调用静默读写 1 号租户数据。
  # 零依赖（仅标准库），只扫 backend/app；测试夹具不在扫描范围。
  org-defaults:
    name: Org Defaults Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Scan for hardcoded default organization
        working-directory: backend
        run: python scripts/check_org_defaults.py

      - name: Checker discriminating-power tests
        working-directory: backend
        run: |
          python -m pip install -q pytest
          python -m pytest tests/unit/test_check_org_defaults.py -q --noconftest

  # W0-1 / ADR-001 D3：禁止 users.role 参与管理员鉴权。
  # 平台级只认显式 is_superuser（is_platform_admin），组织级只认
  # user_organization_role_association 的 OrgAdmin 角色（is_org_admin）。
  # 零依赖（仅标准库 AST），只扫 backend/app；请求体字段校验不在扫描范围。
  rbac-admin-bypass:
    name: RBAC Admin Bypass Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Scan for users.role admin authorization
        working-directory: backend
        run: python scripts/check_rbac_admin_bypass.py

      - name: Checker discriminating-power tests
        working-directory: backend
        run: |
          python -m pip install -q pytest
          python -m pytest tests/unit/test_check_rbac_admin_bypass.py -q --noconftest

  # W0-8 事实不变量：文档里的关键数字（SSE 事件数 / 端点模块数 / 前端路由数 /
  # 工具数 / @router.* 装饰器数）必须等于源码派生值，且与入库的单一事实源
  # docs/facts.json 一致。脚本零依赖（仅标准库 ast/re/json），与其它 hygiene
  # 门禁同款：先跑检查器本体，再用 --noconftest 跑鉴别力测试（不装后端依赖栈）。
  doc-facts:
    name: Doc Facts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check doc facts vs source-derived values
        working-directory: backend
        run: python scripts/check_doc_facts.py

      - name: Checker discriminating-power tests
        working-directory: backend
        run: |
          python -m pip install -q pytest
          python -m pytest tests/unit/test_doc_facts.py -q --noconftest

  # issue #507：密钥防回归门禁（公开仓库历史中已发生真实泄露，见 SECURITY.md）。
  # 全历史扫描：命中不在 .gitleaksignore 登记指纹内的任何密钥 → PR 直接红；
  # 测试夹具/文档示例的假值放行规则在 .gitleaks.toml（不按目录整体放行）。
  # 版本钉死并校验官方 sha256，避免下载链路与扫描行为漂移。
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 必须全历史：.gitleaksignore 指纹按 <commit>:<path>:<rule>:<line> 匹配。
          fetch-depth: 0

      # 安装到 $RUNNER_TEMP（仓库外），避免二进制/压缩包本身进入工作树扫描范围。
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -eu
          VERSION=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          DEST="${RUNNER_TEMP}/gitleaks-bin"
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          mkdir -p "$DEST"
          curl -sSfL -o "$DEST/$ARCHIVE" "${BASE}/${ARCHIVE}"
          curl -sSfL -o "$DEST/gitleaks_checksums.txt" "${BASE}/gitleaks_${VERSION}_checksums.txt"
          # checksums.txt 按官方文件名登记，压缩包必须保持原名后再校验（否则 sha256sum -c 报 No such file）。
          (cd "$DEST" && grep "$ARCHIVE" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "$DEST/$ARCHIVE" -C "$DEST" gitleaks
          echo "$DEST" >> "$GITHUB_PATH"
          "$DEST/gitleaks" version

      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1

      # 纵深防御：工作树扫描（--no-git）不依赖 git 历史口径，兜底生成物/未跟踪内容。
      - name: Scan working tree for secrets
        run: gitleaks detect --source . --no-git --redact --verbose --exit-code 1
