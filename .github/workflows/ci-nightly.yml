name: CI Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:       # manual trigger

concurrency:
  group: ci-nightly-${{ github.ref }}
  cancel-in-progress: false   # 定时任务让它跑完，便于对比历史

permissions:
  contents: read

env:
  SECRET_KEY: test-secret-key-for-pytest-only-32chars!
  JWT_SECRET_KEY: test-jwt-secret-key-for-pytest-only!
  DEEPSEEK_API_KEY: test-key
  EMBEDDING_API_KEY: test-key
  ENABLE_RATE_LIMIT: 'false'
  ENABLE_MONITORING: 'false'
  RUN_INTEGRATION: '1'

jobs:
  backend-integration:
    name: Backend Integration Tests (MySQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false        # 一个 Python 版本挂了不影响另一个跑完
      matrix:
        python-version: ['3.11', '3.12']

    services:
      mysql:
        image: mysql:8.0
        # 与 docker-compose.yml 的 MySQL 启动参数一致。CI 要模拟生产的“行为”，
        # 而不只是连上同一个端口——否则测的是一个生产里不存在的配置。
        # 仓库约定的 canonical collation 见 CHANGELOG。
        command: >-
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/test_db
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      ELASTICSEARCH_HOSTS: '["http://localhost:9200"]'
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      MINIO_ENDPOINT: localhost:9000

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Migration smoke test on real MySQL
        working-directory: backend
        run: |
          alembic upgrade head
          python scripts/check_schema.py

      - name: Run integration tests
        working-directory: backend
        run: |
          python -m pytest tests/integration/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend,integration
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: docmind-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: docmind-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 名字里显式写出 "audits advisory"：bandit 是阻断门禁，依赖审计不是。
  # 否则 Actions 页面上的绿色对勾会被误读成"没有已知漏洞"。
  security:
    name: Security Scan (audits advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 阻断门禁：Medium 及以上当前为 0。真问题已在代码里修掉（如 B314 的 XML 解析），
      # 有意为之的项用带理由的 `# nosec BXXX` 精确抑制，不做全局忽略。
      - name: Static security scan (bandit, medium+)
        working-directory: backend
        run: bandit -r app/ -ll

      # Low 档仅报告：数量多、误报率高（try/except pass、assert 之类）。
      - name: Static security scan (bandit, low, report only)
        if: always()
        working-directory: backend
        run: |
          {
            echo "## Bandit — Low 档（仅报告，不阻断）"
            echo '```'
            bandit -r app/ -l || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 依赖漏洞审计暂为「仅报告」：修复常受制于上游，长期红灯会被无视。
      # 但**工具自身失败必须与「发现漏洞」区分开**——pip-audit 两种情况都可能返回 1，
      # 所以用「报告能否解析出来」判定，而不是用退出码。想升级为阻断门禁时，
      # 把末尾的 ::warning:: 改成 exit 1 即可。
      - name: Audit frontend dependencies (npm audit)
        working-directory: frontend
        run: |
          code=0
          npm audit --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json" 2>&1 || code=$?
          # 「能解析」只是工具完成的**必要**条件,不是充分条件——工具失败时也可能留下
          # 合法但结构不对的 JSON。所以要连结构一起校验。
          if ! node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(!r||typeof r!=='object'||typeof r.metadata!=='object'||typeof r.vulnerabilities!=='object') process.exit(1);" "$RUNNER_TEMP/npm-audit.json" 2>/dev/null; then
            echo "::error::npm audit 未产出结构完整的报告（退出码 $code）—— 工具失败，不是发现漏洞"
            cat "$RUNNER_TEMP/npm-audit.json"
            exit 1
          fi
          {
            echo "## 前端依赖审计 —— ⚠️ STATUS: ADVISORY ONLY"
            echo "> 仅报告,**不阻断构建**。此项为绿色不代表没有已知漏洞。"
            node -e "
              const r = JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));
              console.log('漏洞计数: ' + JSON.stringify(r.metadata?.vulnerabilities ?? {}));
              for (const [n, a] of Object.entries(r.vulnerabilities ?? {})) {
                if (a.severity === 'high' || a.severity === 'critical') {
                  console.log('- ' + n + ' [' + a.severity + '] ' + (a.fixAvailable ? '有修复版本' : '暂无修复'));
                }
              }
            " "$RUNNER_TEMP/npm-audit.json"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning::npm audit 报告了高危及以上漏洞（当前策略：仅报告，不阻断）"
          fi

      - name: Audit backend dependencies (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit
          code=0
          pip-audit -r requirements.txt --format json --progress-spinner off \
            -o "$RUNNER_TEMP/pip-audit.json" || code=$?
          # 结构校验走仓库内脚本，不内联 python -c——格式假设需要被测试钉住。
          # 2026-09-20 事故：内联版假定顶层是数组，而 pip-audit 2.x 实际是
          # {"dependencies": [...]}，于是把一份**正常且确实扫出漏洞**的报告判成了"工具失败"，
          # nightly 因此长期红着却指向错误的原因。回归测试见 tests/unit/test_audit_report.py。
          # 脚本的诊断写 stderr，所以这里**不重定向 stderr**——它必须留在 job 日志里。
          # 未知形态会被拒绝并打印实际结构（脚本版本未固定，形状再变也要响亮地失败）。
          if ! python scripts/audit_report.py --summary "$RUNNER_TEMP/pip-audit.json" > "$RUNNER_TEMP/pip-audit.md"; then
            echo "::error::pip-audit 未产出结构完整的报告（退出码 $code）—— 工具失败，不是发现漏洞；原因见上方 stderr"
            exit 1
          fi
          {
            echo "## 后端依赖审计 —— ⚠️ STATUS: ADVISORY ONLY"
            echo "> 仅报告,**不阻断构建**。此项为绿色不代表没有已知漏洞。"
            cat "$RUNNER_TEMP/pip-audit.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning::pip-audit 报告了依赖漏洞（当前策略：仅报告，不阻断）"
          fi
