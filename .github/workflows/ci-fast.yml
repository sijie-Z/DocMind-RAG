name: CI Fast (PR)

on:
  push:
    branches: [main, develop]
  pull_request:
    # git flow 下 feature/hotfix 的合并目标既可能是 develop 也可能是 main，
    # 两者都要跑门禁——否则合并到 develop 的 PR 完全没有 CI 把关。
    branches: [main, develop]

# 同一分支上新的 push 取消仍在跑的旧 run，避免堆积
concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只需要读代码
permissions:
  contents: read

env:
  # 测试用的假凭据（非机密），集中在此避免各 job 重复
  SECRET_KEY: test-secret-key-for-pytest-only-32chars!
  JWT_SECRET_KEY: test-jwt-secret-key-for-pytest-only!
  DEEPSEEK_API_KEY: test-key
  EMBEDDING_API_KEY: test-key
  ENABLE_RATE_LIMIT: 'false'
  ENABLE_MONITORING: 'false'
  # 这些服务在 fast 档不启动，仅提供配置值让 app.core.config 能加载
  REDIS_HOST: localhost
  REDIS_PORT: '6379'
  ELASTICSEARCH_HOSTS: '["http://localhost:9200"]'
  KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  MINIO_ENDPOINT: localhost:9000

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        include:
          # 只有 3.12 采集覆盖率并应用 fail_under 门禁；3.11 的职责是证明
          # 代码在该版本上能跑，不参与覆盖率判定（避免版本间微小差异卡住 PR）。
          - python-version: '3.12'
            coverage: 'true'

    env:
      DATABASE_URL: sqlite+aiosqlite:///test.db

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 缓存改由 setup-uv 接管（原 ~/.cache/pip 缓存步骤随之移除——迁移后不再有 pip 写入）。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/requirements*.txt'

      # --system：直接装进 actions/setup-python 为矩阵选定的解释器，无需建 venv/激活。
      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        working-directory: backend
        # evals/ 从 #208 第⑤步起是 CI 门禁本体（Eval Gate 跑的就是它），一并纳入 lint 口径。
        run: ruff check app/ tests/ scripts/ evals/

      # 静态安全扫描前置到 PR：此前只在 nightly 跑，而 nightly 已连续红 ≥11 天，
      # 等于这条门禁事实上不存在。bandit 已在 requirements-dev.txt，无需额外安装。
      # 只阻断 medium+；low 档留给 nightly 仅报告。
      - name: Static security scan (bandit, medium+)
        working-directory: backend
        run: bandit -r app/ -ll

      - name: Migration smoke test (SQLite)
        working-directory: backend
        run: |
          alembic upgrade head
          python scripts/check_schema.py

      # 覆盖率只在 3.12 腿启用（见 matrix.include）：3.11 腿不带 --cov，自然不做覆盖率判定。
      #
      # 覆盖率下限**写在这条命令上而不是 pyproject.toml 里**：下限是"针对某个测试子集"的
      # 判断，不是仓库的全局属性。integration job 只跑 tests/integration/（约 32%），
      # 套用同一个 42% 会把一次 179 个测试全过的运行报成失败 —— 这已经真实发生过。
      - name: Run fast tests (unit + api + behavior)
        working-directory: backend
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: |
          # 用 bash 数组而不是字符串变量：`pytest $ARGS` 会被 shellcheck 判为
          # SC2086（未加引号的变量会做词分割/通配），而 `pytest "$ARGS"` 又会把
          # 整串当成单个参数、pytest 找不到路径。数组是唯一同时满足两者的写法。
          ARGS=(tests/unit/ tests/api/ tests/behavior/ -v --tb=short)
          if [ "$COVERAGE" = "true" ]; then
            python -m pytest "${ARGS[@]}" --cov=app --cov-report=xml --cov-report=term --cov-fail-under=42
          else
            python -m pytest "${ARGS[@]}"
          fi

      # 只有 3.12 腿产出 backend/coverage.xml（3.11 腿不采集覆盖率）。
      - name: Upload coverage to Codecov
        if: matrix.coverage == 'true'
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # 迁移必须在真实 MySQL 上验证：SQLite 不校验外键目标表是否存在，
  # 001 曾因此在 SQLite 上假绿、在 MySQL 上 1824 失败。
  migration-mysql:
    name: Migration (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        # 与 docker-compose.yml 的 MySQL 启动参数一致。CI 要模拟生产的“行为”，
        # 而不只是连上同一个端口——否则测的是一个生产里不存在的配置。
        # 仓库约定的 canonical collation 见 CHANGELOG。
        command: >-
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 缓存改由 setup-uv 接管（原 ~/.cache/pip 缓存步骤随之移除——迁移后不再有 pip 写入）。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/requirements*.txt'

      # --system：直接装进 actions/setup-python 选定的解释器，无需建 venv/激活。
      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      # 两个库共用同一个 MySQL service：一条走 Alembic（未来路径），
      # 一条走 create_all（生产当前实际路径），避免另起 job 的额外开销。
      - name: Create test databases
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE test_alembic;"
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE test_create_all;"

      - name: Alembic path — upgrade / downgrade / upgrade
        working-directory: backend
        env:
          DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/test_alembic
        run: |
          echo "::group::alembic upgrade head"
          alembic upgrade head
          python scripts/check_schema.py --report-columns
          echo "::endgroup::"

          echo "::group::alembic downgrade base"
          alembic downgrade base
          echo "::endgroup::"

          echo "::group::alembic upgrade head（round-trip：验证迁移可逆、可重建）"
          alembic upgrade head
          python scripts/check_schema.py --report-columns
          echo "::endgroup::"

      # 生产实际调用的是 init_db() → Base.metadata.create_all
      # （app/core/database.py）。只验证 Alembic 会漏掉生产路径上的方言问题。
      - name: create_all path — production schema bootstrap
        working-directory: backend
        env:
          DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/test_create_all
        run: |
          python -c "import asyncio; from app.core.database import init_db; asyncio.run(init_db())"
          python scripts/check_schema.py --create-all --report-columns

  # Integration 在「push 到 develop」与「PR 指向 develop」时都跑（issue #176），
  # 且必须等快速门禁通过。
  # 语义：integration 永远验证「一个已通过 PR 门禁的 develop 提交」。
  #
  # 此前只在 develop push 触发，导致新增/修改 tests/integration/ 的 PR 在合并前
  # 永远不执行这些用例 —— #170 的端口文件用例就是这样带着必然失败合入 develop 的
  # （PR #173 里本 job 是 skipped，CI 全绿，直到 develop 推送才爆）。PR 上本 job
  # 复用同样的 MySQL/Redis 服务容器，无需额外基础设施；代价是每个指向 develop 的
  # PR 多一个约 4 分钟的 job（关键路径从 ~78s 到 ~4min，见 issue #176 的取舍记录）。
  #
  # 为什么不用 workflow_run 监听 CI Fast：该触发要求 workflow 文件存在于默认分支
  # （本仓库的 main 只在发版时更新），会让 integration 的定义无法跟随 develop 演进。
  # 用同 workflow 内的 needs + if 表达同一语义，且无此约束。
  integration:
    name: Integration Tests (MySQL + Redis + ES)
    needs: [backend-tests, migration-mysql]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 只保留 3.12 一条腿：3.11 的兼容性已由 backend-tests 的 matrix 在每个 PR 上
        # 覆盖；integration 验证的是真实服务行为，与 Python 小版本无关，
        # 跑两条腿会让每次合并多花约 95 秒。
        python-version: ['3.12']

    # services / job 级 env / 各 step 自 ci-nightly.yml 的 backend-integration job
    # 搬运（有意的重复：对单人项目，重复一份 job 定义比 reusable workflow 的间接层更简单）。
    services:
      mysql:
        image: mysql:8.0
        # 与 docker-compose.yml 的 MySQL 启动参数一致。CI 要模拟生产的“行为”，
        # 而不只是连上同一个端口——否则测的是一个生产里不存在的配置。
        # 仓库约定的 canonical collation 见 CHANGELOG。
        command: >-
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      elasticsearch:
        # 版本与 docker-compose.yml 的 docmind-elasticsearch 保持一致 ——
        # CI 要验的是生产的**行为**，用别的版本等于测一个生产里不存在的组合。
        #
        # 为什么必须加：此前 job 名写着 "(MySQL + Redis)"、services 里也确实没有 ES，
        # 但 env 里 ELASTICSEARCH_HOSTS 指向 localhost:9200 —— **指向一个不存在的服务**。
        # 后果是任何依赖真实 ES 的集成测试在 CI 上必然连接失败
        # （`tests/integration/test_index_*.py` 就是撞在这上面）。
        #
        # 单节点 + 关安全：CI 里不需要集群与认证，只验行为。
        # 堆内存压到 512m，避免这个 job 拖垮 runner。
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/test_db
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      ELASTICSEARCH_HOSTS: '["http://localhost:9200"]'
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      MINIO_ENDPOINT: localhost:9000
      # nightly 里这行在工作流级 env，这里下移到 job 级（ci-fast 的其它 job 不需要它）。
      # 不加它，tests/integration 下 3 个带 skipif(RUN_INTEGRATION != "1") 的文件会整组跳过。
      RUN_INTEGRATION: '1'

    steps:
      # checkout 不复刻 nightly 的 ref: ${{ inputs.ref || 'develop' }}：那一行是为
      # schedule 只在默认分支触发准备的，且 inputs 上下文只存在于 workflow_dispatch /
      # workflow_call。这里默认签出即 github.sha —— 本次 push 的提交本身，
      # 与 backend-tests 验的是同一个 commit，比按分支名二次解析更精确。
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 与 backend-tests / migration-mysql 用同一套安装方式（uv），
      # 避免同一文件里混用 pip / uv 两种路径。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/requirements*.txt'

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Migration smoke test on real MySQL
        working-directory: backend
        run: |
          alembic upgrade head
          python scripts/check_schema.py

      # 整份 tests/ 一起跑，而不是只跑 tests/integration/（issue #160）：
      # 「跨套件污染」只有把所有套件放进**同一个进程**才暴露——integration 进程内跑
      # alembic env.py 时 fileConfig() 默认 disable_existing_loggers=True，会把既有
      # logger 的 disabled 旗标置 True 并全进程残留，害得后面 unit 用例的日志断言集体
      # 假红；拆成两个 job 跑时任何一边都看不见这种时序缺陷。该 job 只在 develop 推送
      # （即合并）上运行，PR 门禁仍由 backend-tests 的 sqlite 快跑负责。
      - name: Run full test suite (all suites in one process)
        working-directory: backend
        run: |
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend,integration
          fail_ci_if_error: false

  # Eval Gate（#208 第⑤步）：把检索评估从「本地工具」固化成 CI 门禁。
  #
  # 回归类型：现有 job 全都不测「真实 ES 上的检索质量」——unit/api 用 fake 检索、
  # integration 只测索引读写行为。检索臂（关键词/向量/RRF/MMR/后处理）的行为回归
  # 此前没有任何门禁能拦（#208 的五步计划正因一次真实的质量漂移而立）。
  #
  # 与 integration 的差异（有意的）：
  # - 触发同整个 workflow（每个 PR + main/develop push），不采用 integration 的
  #   develop 限定——评估门禁的语义就是「拦住任何一次合入」，且本 job 无 needs、
  #   与 Backend Tests 并行起步，不进关键路径；
  # - 因此它是一个**无条件** job，可以直接接进 CI Pass 汇聚（CI Pass 是分支保护
  #   要求的必需检查；不接进去的话红点没有任何东西消费它 = 孤儿检查）。
  #
  # 确定性设计（消除了「不同 seed 物理状态间 NearMiss 摆动」的评审警告）：
  # 每次从零「先删后建」专用评估索引 docmind_knowledge_eval_ci_v1、refresh 到
  # visible、回读 count 断言；嵌入走 evals/deterministic_embedding.py 的确定性
  # 伪嵌入（无 Ollama/无网络）。跑分与基线比对细节见 backend/docs/eval-gate-phase1.md
  # 的「CI 门禁」一节；`make eval-ci` 三步任一步非零 = 门禁红。
  eval-gate:
    name: Eval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      elasticsearch:
        # 与 integration / docker-compose 同版本（8.11.0）——CI 要验的是与
        # 本地基线相同的行为，换版本等于测一个不存在的组合。
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/requirements*.txt'

      # 只要 runtime 依赖：评估链不 import tests / scripts 侧的东西。
      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements.txt

      # 三步：seed --recreate（先删后建 + 回读断言）→ run（伪嵌入）→ compare
      # （floor/cap 比对，非零退出码即红）。数字全部打进本 step 的 CI 日志。
      - name: Eval gate (seed → run → compare)
        run: make eval-ci

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # ESLint 9+ 移除了 --ext（改由 flat config 的 files 决定范围）
        run: npx eslint .

      - name: Type check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Run tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: frontend/coverage/
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        working-directory: frontend
        run: npm run build

      # E2E 冒烟不放在本 job 里：它会给 frontend-tests 增加约 100 秒，
      # 使其超过 Backend Tests 成为新的关键路径、把 PR 墙钟从约 133 秒推到约 180 秒。
      # 改为独立的并行 job（见下方 frontend-e2e），墙钟不变。

  # E2E 冒烟：纯前端 + page.route 打桩，**不需要后端/数据库服务**。
  # 独立成 job 是为保住快速门禁的墙钟 —— 与前端单测并行跑。
  frontend-e2e:
    name: Frontend E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 与 screenshots.yml 共用同一个缓存 key，命中即约 5 秒
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/test-results/
          retention-days: 7

  # 校验 workflow 文件本身：表达式、needs 引用、shellcheck run 块
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          # TODO(actionlint): 临时兼容,不是永久设计。
          # actionlint 1.7.12 的内置 schema 还没有 2026-04 GA 的 services.command /
          # entrypoint，会把下面这行报成错误——属误报。
          # 依据: https://github.blog/changelog/2026-04-02-github-actions-early-april-2026-updates/
          #       （"Customizing entrypoints for service containers"）
          # actionlint 更新 schema 后即可删除这条 -ignore。
          # 正则用 `.` 代替字面双引号：结果等价，且 PowerShell 下也不会因引号传递而失效。
          ./actionlint -color \
            -ignore 'unexpected key .command. for .services. section'

  ci-pass:
    name: CI Pass
    if: always()
    # eval-gate 是无条件 job（每个 PR 都跑），因此直接进汇聚：
    # 红 = CI Pass 红 = 分支保护拦下（不是孤儿检查）。
    needs: [backend-tests, migration-mysql, eval-gate, frontend-tests, frontend-e2e, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          failed=0
          for r in \
            "backend-tests=${{ needs.backend-tests.result }}" \
            "migration-mysql=${{ needs.migration-mysql.result }}" \
            "eval-gate=${{ needs.eval-gate.result }}" \
            "frontend-tests=${{ needs.frontend-tests.result }}" \
            "frontend-e2e=${{ needs.frontend-e2e.result }}" \
            "workflow-lint=${{ needs.workflow-lint.result }}"; do
            name="${r%%=*}"; result="${r#*=}"
            if [ "$result" != "success" ]; then echo "::error::$name -> $result"; failed=1; fi
          done
          [ "$failed" -eq 0 ] && echo "All CI checks passed!"
          exit "$failed"
