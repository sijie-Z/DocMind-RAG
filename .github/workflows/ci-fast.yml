name: CI Fast (PR)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check app/ tests/

      - name: Set test environment
        run: |
          echo "SECRET_KEY=test-secret-key-for-pytest-only-32chars!" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=test-jwt-secret-key-for-pytest-only!" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite+aiosqlite:///test.db" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "ELASTICSEARCH_HOSTS=[\"http://localhost:9200\"]" >> $GITHUB_ENV
          echo "KAFKA_BOOTSTRAP_SERVERS=localhost:9092" >> $GITHUB_ENV
          echo "MINIO_ENDPOINT=localhost:9000" >> $GITHUB_ENV
          echo "DEEPSEEK_API_KEY=test-key" >> $GITHUB_ENV
          echo "EMBEDDING_API_KEY=test-key" >> $GITHUB_ENV
          echo "ENABLE_RATE_LIMIT=false" >> $GITHUB_ENV
          echo "ENABLE_MONITORING=false" >> $GITHUB_ENV

      - name: Migration smoke test (alembic upgrade head)
        working-directory: backend
        run: |
          alembic upgrade head
          python -c "import sqlite3; c=sqlite3.connect('test.db'); t={r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}; assert len(t) >= 26, f'expected >=26 tables, got {len(t)}'"

      - name: Run fast tests (unit + behavior)
        working-directory: backend
        run: |
          python -m pytest tests/unit/ tests/behavior/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint . --ext .vue,.ts,.tsx

      - name: Type check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Run tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: frontend/coverage/
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        working-directory: frontend
        run: npm run build

  ci-pass:
    name: CI Pass
    if: always()
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then echo "backend-tests failed"; exit 1; fi
          if [ "${{ needs.frontend-tests.result }}" != "success" ]; then echo "frontend-tests failed"; exit 1; fi
          echo "All CI checks passed!"
