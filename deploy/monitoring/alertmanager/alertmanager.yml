global:
  resolve_timeout: 5m

route:
  receiver: default-receiver
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: default-receiver
    webhook_configs:
      # 占位符由 compose 启动时用 sed 渲染到临时配置（Alertmanager v0.26.0 不支持
      # 配置文件内环境变量展开）；token 需与后端 ALERT_WEBHOOK_TOKEN 保持一致。
      - url: "http://host.docker.internal:8000/api/v1/monitoring/alerts/webhook?token=__ALERT_WEBHOOK_TOKEN__"
        send_resolved: true
