services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # Alertmanager v0.26.0 不支持配置文件内环境变量展开（无 --config.expand-env）。
    # 启动时用 sed 把 token 渲染到 /tmp 的临时配置，再 exec 启动；模板不落明文 token。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'sed "s|__ALERT_WEBHOOK_TOKEN__|$${ALERT_WEBHOOK_TOKEN}|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager'
    environment:
      # 与后端 ALERT_WEBHOOK_TOKEN 保持一致；未设置时 compose 直接报错（fail-closed）。
      # 请使用 URL 安全字符（避免 sed 分隔符 | 与 &）。
      - ALERT_WEBHOOK_TOKEN=${ALERT_WEBHOOK_TOKEN:?ALERT_WEBHOOK_TOKEN_required}
    extra_hosts:
      # 容器内通过 host.docker.internal 访问宿主机后端（Linux 需要 host-gateway）
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      # 不提供默认口令；未设置时 compose 直接报错（fail-closed）
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD_required}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
      - alertmanager
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
