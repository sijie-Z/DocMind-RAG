apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmind-backend
  namespace: docmind
  labels:
    app: docmind-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: docmind-backend
  template:
    metadata:
      labels:
        app: docmind-backend
    spec:
      # issue #495：迁移只在 09-migrate-job.yaml 的 Job 里执行一次（串行、不竞争）；
      # 这里用 check_schema.py 做只读校验——库未到迁移 head 时 initContainer 失败，
      # Pod 不启动（fail-closed），不会带着落后 schema 提供 500。
      initContainers:
        - name: schema-check
          image: docmind-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/check_schema.py"]
          envFrom:
            - configMapRef:
                name: docmind-config
            - secretRef:
                name: docmind-secrets
      containers:
        - name: backend
          image: docmind-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: docmind-config
            - secretRef:
                name: docmind-secrets
          livenessProbe:
            # 存活只看进程（恒 200）：依赖故障摘流，不重启 Pod（issue #223）。
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            # 就绪：DB + ES 集群 + 知识库索引对账；不可用 → 503 摘流（issue #223）。
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            # 检查内部每个依赖最多等 3s；默认 1s 会比检查本身先超时。
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
