apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmind-backend
  namespace: docmind
  labels:
    app: docmind-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: docmind-backend
  template:
    metadata:
      labels:
        app: docmind-backend
    spec:
      containers:
        - name: backend
          image: docmind-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: docmind-config
            - secretRef:
                name: docmind-secrets
          livenessProbe:
            # 存活只看进程（恒 200）：依赖故障摘流，不重启 Pod（issue #223）。
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            # 就绪：DB + ES 集群 + 知识库索引对账；不可用 → 503 摘流（issue #223）。
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            # 检查内部每个依赖最多等 3s；默认 1s 会比检查本身先超时。
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
