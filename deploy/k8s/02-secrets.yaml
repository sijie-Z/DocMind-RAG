apiVersion: v1
kind: Secret
metadata:
  name: docmind-secrets
  namespace: docmind
type: Opaque
stringData:
  # ============================================================================
  # 全部为占位符：kubectl apply 之前必须替换为真实值（或在集群外预创建同名 Secret）。
  # 生成命令：
  #   python -c "import secrets; print(secrets.token_hex(32))"      # SECRET_KEY / JWT_SECRET_KEY
  #   python -c "import secrets; print(secrets.token_urlsafe(24))"  # 数据库/中间件口令
  # 创建方式（推荐，避免占位符入库）：
  #   kubectl create secret generic docmind-secrets -n docmind \
  #     --from-literal=SECRET_KEY=... --from-literal=JWT_SECRET_KEY=... \
  #     --from-literal=DATABASE_URL=... --from-literal=MINIO_ACCESS_KEY=... ...
  # 详见 deploy/README.md「Kubernetes → Secret 创建方式」。
  # ============================================================================
  SECRET_KEY: "REPLACE_ME_32_BYTE_HEX"
  JWT_SECRET_KEY: "REPLACE_ME_32_BYTE_HEX"
  DEEPSEEK_API_KEY: "REPLACE_ME_DEEPSEEK_API_KEY"
  EMBEDDING_API_KEY: "REPLACE_ME_EMBEDDING_API_KEY"
  # Rerank 默认走本地 BGE（RERANK_USE_LOCAL=true），无需 API Key；
  # 启用云端 Rerank 时再补 RERANK_API_KEY。
  # RERANK_API_KEY: "REPLACE_ME_RERANK_API_KEY"
  # 数据库连接串（含口令）：只存 Secret，由 backend/worker 的 envFrom.secretRef 注入。
  # 口令部分替换为随机值；用户名/库名按实际环境调整。
  DATABASE_URL: "mysql+aiomysql://docmind:REPLACE_ME_DB_PASSWORD@docmind-mysql:3306/docmind"
  MYSQL_ROOT_PASSWORD: "REPLACE_ME_MYSQL_ROOT_PASSWORD"
  # MinIO / Redis 口令同样只存 Secret
  MINIO_ACCESS_KEY: "REPLACE_ME_MINIO_ACCESS_KEY"
  MINIO_SECRET_KEY: "REPLACE_ME_MINIO_SECRET_KEY"
  # 启用 Redis 认证时取消注释（并与服务端配置保持一致）：
  # REDIS_PASSWORD: "REPLACE_ME_REDIS_PASSWORD"
