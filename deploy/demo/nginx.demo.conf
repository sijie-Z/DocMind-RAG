# DocMind Demo 前端 nginx —— 在 frontend/nginx.conf 基础上加演示站安全闸：
#   - 普通 API 300 请求/分钟（突发 60）；聊天/Agent（LLM 花钱）30 请求/分钟（突发 5）
#   - 请求体上限 12m（后端 MAX_FILE_SIZE=10MB 兜底，超限返回 413）
#   - server_tokens off / HSTS + 安全头（snippet 在声明了 add_header 的 location 内重复，
#     因为 nginx 的 add_header 不做继承合并）
#   - Tunnel 场景按 CF-Connecting-IP 还原真实客户端 IP（只信任回环/私网来源）
# 其余路由（SPA、WebSocket、SSE）与生产配置保持一致。

upstream backend {
    server backend:8000;
}

limit_req_zone $binary_remote_addr zone=docmind_api:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=docmind_llm:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 12m;

    # 入站来自 cloudflared 容器（私网地址），真实客户端在 CF-Connecting-IP。
    # 前端只绑 127.0.0.1，只有本机进程或隧道能连入，信任私网来源是安全的。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/snippets/security_headers.conf;

    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        include /etc/nginx/snippets/security_headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security_headers.conf;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security_headers.conf;
    }

    # WebSocket endpoints（与生产一致：升级头必须转发）
    location = /api/v1/notifications/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location = /api/v1/chat/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location /api/v1/terminal/ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # API proxy（普通请求限流）
    location /api/ {
        limit_req zone=docmind_api burst=60 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
    }

    # 聊天（LLM 成本入口）：更严格的限流
    location /api/v1/chat/ {
        limit_req zone=docmind_llm burst=5 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # 版本号动态读取（关于页需要根级 /health）
    location = /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
    }

    location /ws/ {
        proxy_pass http://backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Agent SSE（LLM 成本入口）：与聊天同档限流；前缀匹配优先于 /api/，
    # 此前缺失 limit_req 会让这条路径绕过成本闸。
    location /api/v1/agent/ {
        limit_req zone=docmind_llm burst=5 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_http_version 1.1;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
