# DocMind RAG Knowledge Base System - Docker Compose
# All secrets are injected via .env.docker (copy from .env.docker.example)

services:
  # FastAPI backend
  backend:
    build: .
    container_name: docmind-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      # Override connection strings for Docker internal networking
      # 口令必须显式提供（fail-closed）：填写在 .env.docker，并以
      # docker compose --env-file .env.docker ... 运行（Compose 插值来源）。
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-docmind}:${MYSQL_PASSWORD:?MYSQL_PASSWORD_required}@docmind-mysql:3306/${MYSQL_DATABASE:-docmind}
      - REDIS_HOST=docmind-redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOSTS=["http://docmind-elasticsearch:9200"]
      - MINIO_ENDPOINT=docmind-minio:9000
      - KAFKA_BOOTSTRAP_SERVERS=docmind-kafka:9092
      - RATE_LIMIT_REQUESTS_PER_MINUTE=300
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=30
      # issue #207：打开 31 个 Prometheus 指标（此前默认 no-op）
      - PROMETHEUS_ENABLED=true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./logs:/app/logs
      - ./temp_uploads:/app/temp_uploads
    extra_hosts:
      # 容器内通过 host.docker.internal 访问宿主机（默认 Embedding 指向宿主机 Ollama）
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 就绪检查而非 /health（后者恒 200，等于永远健康——issue #223）。
      # /readyz 在 DB/ES/知识库索引不可用时返回 503，urlopen 会抛 HTTPError。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - docmind-network
    restart: unless-stopped

  # RAG Worker - document parsing and indexing
  worker:
    build: .
    container_name: docmind-worker
    command: python start_worker.py
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-docmind}:${MYSQL_PASSWORD:?MYSQL_PASSWORD_required}@docmind-mysql:3306/${MYSQL_DATABASE:-docmind}
      - REDIS_HOST=docmind-redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOSTS=["http://docmind-elasticsearch:9200"]
      - MINIO_ENDPOINT=docmind-minio:9000
      - KAFKA_BOOTSTRAP_SERVERS=docmind-kafka:29092
      # 存活性心跳（issue #156）：消费循环刷新该文件，健康检查读它的新鲜度。
      # 容器内经此变量固定 /tmp 路径；应用层默认值走 tempfile.gettempdir()（可移植）。
      - WORKER_HEARTBEAT_FILE=/tmp/docmind_worker_heartbeat
      - WORKER_HEARTBEAT_MAX_AGE_SECONDS=90
      # issue #207：worker 侧同样开启指标
      - PROMETHEUS_ENABLED=true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      # worker 不监听任何端口，复用镜像里探 :8000 的 HEALTHCHECK 会永远
      # unhealthy（issue #156）。这里改为真实存活性信号：消费循环每次 Kafka
      # 轮询（空闲时也按 POLL_TIMEOUT_MS 返回）刷新 /tmp 心跳文件，
      # worker_healthcheck.py 检查 mtime 是否过期——进程被冻结 / 消费循环
      # 卡死时心跳停止刷新，容器即判为 unhealthy。
      test: ["CMD", "python", "worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      # 容器内通过 host.docker.internal 访问宿主机（默认 Embedding 指向宿主机 Ollama）
      - "host.docker.internal:host-gateway"
    networks:
      - docmind-network
    restart: unless-stopped

  # MySQL 8 with UTF8MB4
  mysql:
    image: mysql:8.0
    container_name: docmind-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --bind-address=0.0.0.0
    environment:
      # 安全：口令必须显式提供（缺省时 compose 直接报错，不再回退到弱默认值），
      # 生成命令: python -c "import secrets; print(secrets.token_hex(24))"（详见 deploy/README.md）
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD_required}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-docmind}
      - MYSQL_USER=${MYSQL_USER:-docmind}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD_required}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      # 不挂载初始化 SQL（原 docker/mysql/init.sql 已删）：建表归 ORM
      # create_all / alembic；旧脚本 MariaDB 专有语法（CREATE INDEX
      # IF NOT EXISTS）在 mysql:8.0 直接失败，且 initdb 时序早于建表。
      - mysql-data:/var/lib/mysql
    networks:
      - docmind-network
    healthcheck:
      # 容器内复用 MYSQL_ROOT_PASSWORD 环境变量（$$ 转义避免 Compose 提前插值）
      test: "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
      timeout: 20s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docmind-redis
    # REDIS_PASSWORD（可选）：在运行 compose 的 shell 环境或项目 .env 中设置——这是 Compose 插值
    # 的来源（.env.docker 只作为 backend/worker 的 env_file 注入容器，不参与插值，已实测 2026-10-05）。
    # ⚠️ 启用密码时两处都要设：服务端用上述来源，应用侧 backend/worker 用 .env.docker；只设 .env.docker
    # 服务端仍无密码（nopass 用户接受任意 AUTH，应用能连上，但并未受密码保护）。
    # 未设置时以无密码模式运行（仅绑定 127.0.0.1）。
    # ⚠️ 不能写成 `command: redis-server --requirepass ${REDIS_PASSWORD:-}`：
    # 空值时 Compose 分词会把空参数整个丢掉，命令变成 ["redis-server","--requirepass"]（缺参），
    # redis-server 读配置直接 FATAL，容器无限重启（issue #149）。
    # 改为显式分支：密码经容器环境变量传入，运行时判断是否启用；
    # 并委托镜像自带 entrypoint（$1=redis-server）启动，保留 upstream 的 /data chown + gosu 降权行为。
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD";
             else
               exec docker-entrypoint.sh redis-server;
             fi'
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - redis-data:/data
    networks:
      - docmind-network
    healthcheck:
      # 同样不能用 `-a ${REDIS_PASSWORD:-}` 拼参数（空值会发一次 AUTH ""，无密码服务端报错）。
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi']
      timeout: 20s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: docmind-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - docmind-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  minio:
    # 固定日期标签：MinIO 官方已停发 `latest`（issue #234）。该 RELEASE 标签的上游仓库
    # 已删（无缓存镜像源直报 404、dl.min.io 410），当前唯一可拉路径=镜像源缓存
    # （issue #235 侦察实证：daocloud/1panel 双源 200、digest 与本地逐字节一致）。
    # 故显式写镜像源全名：新环境无需本机 daemon 额外配置即可拉取。
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: docmind-minio
    environment:
      # 必填：生成随机凭据并写入 .env.docker（MINIO_SECRET_KEY 至少 8 位），缺省时 compose 直接报错
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY_required}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY_required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - docmind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: docmind-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - docmind-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: docmind-kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"       # 宿主机 → Kafka（API 在宿主机上跑，用 localhost:9092）
      - "29092:29092"     # Docker 内网 → Kafka（Worker 用 docmind-kafka:29092）
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: docmind-zookeeper:2181
      # 双监听器：内部用 Docker 网络名，外部用 localhost
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://docmind-kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - docmind-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: docmind-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    networks:
      - docmind-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: docmind-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # 管理员口令必须显式提供（缺省时 compose 直接报错），通过 .env.docker 的 GRAFANA_PASSWORD 提供
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD_required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - docmind-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  elasticsearch-data:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  docmind-network:
    driver: bridge
    
