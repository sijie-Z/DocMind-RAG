[tool.ruff]
# DocMind Python linting configuration
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Enable rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins
    "RET",  # return
    "SLF",  # self/private
    "SIM",  # simplify
]

# Ignore specific rules
ignore = [
    "E501",    # line too long (handled by ruff format)
    "N802",    # function names in snake_case — FastAPI handlers often use CamelCase
    "N803",    # argument names
    "N806",    # variable names
    "N815",    # mixed case variables
    "SIM108",  # ternary if
    "SIM117",  # multiple with
    "SIM115",  # open with
    "B008",    # function-call-in-default-argument — FastAPI Depends() is designed for this
    "E402",    # module-import-not-at-top — intentional for circular import avoidance
    "B904",    # raise-without-from-inside-except
    "W293",    # blank-line-with-whitespace
    "SLF001",  # private-member-access
    "UP042",   # replace-str-enum
    "A002",    # builtin-argument-shadowing — intentional (format, id, type)
    "A003",    # builtin-attribute-shadowing
    "E741",    # ambiguous-variable-name — math conventions (l, O)
    "B005",    # strip-with-multi-characters
    "SIM102",  # collapsible-if — readability preference
    "SIM105",  # suppressible-exception
    "E721",    # type-comparison — isinstance not always equivalent
    "N818",    # exception-name-should-end-with-Error — test fixtures use FakeException
    "UP035",   # deprecated-import (typing.Callable) — deferred to later pass
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["A", "SLF", "N818"]
"app/models/*" = ["F821", "F401"]  # SQLAlchemy string-based relationship() references; re-exports

# pytest 的唯一配置源。backend/pytest.ini 已删除——只要它存在，pytest 就整体忽略本段
# （pytest.ini 优先级高于 pyproject.toml），`markers` 声而不效即源于此。
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# 以下三键原先只存在于 pytest.ini，合并时漏搬会静默改变行为：
#   testpaths      —— 裸跑 pytest 会收进 backend/ 根下的脚本（test_api.py 里的用例会真发 httpx 请求）
#   asyncio_mode   —— 见下方说明
#   filterwarnings —— 只影响告警噪音
#
# asyncio_mode 目前是【冗余】的：全仓 96 个 async 测试函数**全部**带显式
# @pytest.mark.asyncio（AST 统计：未标记数为 0），实测 auto 与 strict 结果完全一致
# （466 passed, 1 skipped）。保留它是为了不让**将来新增的**未标记 async 测试
# 在 strict 模式下静默不执行。
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (need DB/ES/Redis)",
    "slow: Slow tests (deselect with -m 'not slow')",
]
