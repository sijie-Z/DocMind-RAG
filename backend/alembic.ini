[alembic]
script_location = alembic
prepend_sys_path = .
# 运行迁移时由 alembic/env.py 以 settings.DATABASE_URL 覆盖；此处仅作占位，勿写入明文凭据
DB_USER =
DB_PASSWORD =
sqlalchemy.url = mysql+aiomysql://%(DB_USER)s:%(DB_PASSWORD)s@localhost:3306/docmind_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
