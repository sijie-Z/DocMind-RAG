repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  # 密钥门禁（issue #507）：与 CI ci-hygiene 的 secret-scan job 同版本，
  # 扫 staged 变更；命中 .gitleaks.toml/.gitleaksignore 之外的任何密钥即失败。
  # 官方 hook 用 language: golang，pre-commit 首次运行会自行编译（本机需 Go）；
  # 无 Go 的机器可安装 gitleaks 二进制后改用同仓库的 gitleaks-system hook。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # 用项目自身的 eslint（flat config）而不是在 pre-commit 里另装一套：
  # 后者会与 package.json 版本漂移（此前 pre-commit 装 8.56 + 旧插件，而 CI 用 9/10），
  # 且 ESLint 8 不认 flat config。entry 用 --prefix 以便从仓库根目录执行。
  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(vue|ts|tsx)$

  - repo: local
    hooks:
      - id: frontend-typecheck
        name: Frontend type check
        entry: npm --prefix frontend run type-check
        language: system
        pass_filenames: false
        files: ^frontend/
