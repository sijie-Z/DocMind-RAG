repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # 用项目自身的 eslint（flat config）而不是在 pre-commit 里另装一套：
  # 后者会与 package.json 版本漂移（此前 pre-commit 装 8.56 + 旧插件，而 CI 用 9/10），
  # 且 ESLint 8 不认 flat config。entry 用 --prefix 以便从仓库根目录执行。
  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(vue|ts|tsx)$

  - repo: local
    hooks:
      - id: frontend-typecheck
        name: Frontend type check
        entry: npm --prefix frontend run type-check
        language: system
        pass_filenames: false
        files: ^frontend/
